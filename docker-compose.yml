# =============================================================================
# Infrastructure Services — PostgreSQL + Redis
# Used for local development via WSL Docker
# Run: docker compose up -d
# Stop: docker compose down
# =============================================================================
services:
  postgres:
    image: postgres:17-alpine
    container_name: dcacti-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dcacti
      POSTGRES_PASSWORD: dcacti_dev_password
      POSTGRES_DB: dcacti_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcacti -d dcacti_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: dcacti-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
